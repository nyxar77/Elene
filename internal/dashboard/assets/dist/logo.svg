<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">ELENE</title>
  <desc id="d">Robot head with two antennae; the E is its face, and the middle bar ends in an eye.</desc>
  <defs>
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <!-- E cut out of the head -->
      <rect x="76" y="88" width="11" height="52" rx="3" fill="#000"/>
      <rect x="76" y="88" width="48" height="11" rx="3" fill="#000"/>
      <rect x="76" y="129" width="48" height="11" rx="3" fill="#000"/>
      <rect x="76" y="108.5" width="30" height="11" rx="3" fill="#000"/>
      <!-- the eye -->
      <circle cx="116" cy="114" r="8" fill="#000"/>
    </mask>
  </defs>
  <!-- head -->
  <path mask="url(#face)" fill="#FFB454"
        d="M30 150V130A70 70 0 0 1 170 130V150Q170 160 160 160H40Q30 160 30 150Z"/>
  <!-- antennae -->
  <g stroke="#FFB454" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="68" y1="58" x2="50" y2="26"/>
    <line x1="132" y1="58" x2="150" y2="26"/>
  </g>
</svg>
